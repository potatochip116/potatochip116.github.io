<div class=embed-box>
	<h2>My 2nd Project: Video About My Day</h2>
<iframe
  src="https://new.express.adobe.com/embedLink/urn:aaid:sc:VA6C2:a7865767-cea7-55f0-934f-8fd2db814f92?promoid=Y69SGM5H&sdid=C4SZ2FYJ&mv=other"
  width="1280"

  allowfullscreen="allowfullscreen"
  allow="clipboard-write; fullscreen"
  referrerpolicy="strict-origin-when-cross-origin"
  frameborder="0"
  style="width:80%; max-width:1280px; height:auto; aspect-ratio:1280/720; border:0; display:block; margin:0 auto;"
  
></iframe>

<button class="likeButtons">Like</button>
<span class="numLikes">0</span>
	  
</div>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
	import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
	
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB9hEyRJyV16OW69KgOGzxIhW1s1std4B8",
      authDomain: "likebuttons1-43c40.firebaseapp.com",
      projectId: "likebuttons1-43c40",
      storageBucket: "likebuttons1-43c40.firebasestorage.app",
      messagingSenderId: "557075593881",
      appId: "1:557075593881:web:de732d013f5b8c5c019608"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
	const db = getDatabase(app);
	const likeButtons = document.querySelectorAll(".likeButtons")
	const numLikes = document.querySelectorAll(".numLikes")

	for (let i=0; i<likeButtons.length; i++) {
		likeButtons[i].addEventListener('click', function(){ Like(i) })
		onValue(ref(db, "/project "+i+"/numLikes"), (snapshot) => {
			let data = snapshot.val();
			numLikes[i].innerHTML = data
		});
	}

	function Like(i) {
		let numberLikes = parseInt(numLikes[i].innerHTML)
		numberLikes = numberLikes + 1
		set(ref(db, "project " + i), {
			numLikes: numberLikes,
		});

	}
</script>

	
	
	
</body>
